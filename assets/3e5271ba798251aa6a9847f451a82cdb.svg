<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="705" height="44.17598" viewBox="0,0,705,44.17598"><defs><linearGradient x1="-32" y1="180" x2="672" y2="180" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><g transform="translate(32.5,-157.91201)"><g stroke-miterlimit="10"><path d="M-32,201.58799v-43.17598h704v43.17598z" fill="url(#color-1)" stroke="#ffffff"/><text transform="translate(162.66295,178.32837) scale(0.18737,0.18737)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" font-family="Archivo" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Today marks the release of Color Lab, a fast-paced bubble-popping arcade game from</tspan><tspan x="0" dy="46.150000000000006px">Neptune Corporation! In Color Lab, your goal is simple: stop the descending bubbles before</tspan><tspan x="0" dy="46.150000000000006px">they reach the bottom of the screen.</tspan></text><text transform="translate(162.5,169.43398) scale(0.28983,0.28983)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" font-family="Archivo Black" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Color Lab Is Out Now!</tspan></text><text transform="translate(374.83333,167.15698) scale(0.15523,0.15523)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" font-family="Archivo Black" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">June 17, 2026</tspan></text></g></g></svg>